name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.4

      - name: Install project dependencies
        run: poetry install --no-interaction

      - name: Install Chromium
        run: poetry run playwright install --with-deps chromium

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Run linting
        run: poetry run ruff check .

      - name: Run type checking
        run: poetry run mypy src tests

      - name: Run UI tests
        run: poetry run pytest tests/ui
        env:
          RBP_BASE_URL: https://automationintesting.online

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

