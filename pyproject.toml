[project]
name = "restful-booker-ui-tests"
version = "0.1.0"
description = "Layered UI test automation framework for Restful Booker Platform"
authors = []
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
jsonschema = ">=4.23,<5.0"
playwright = ">=1.50,<2.0"
pytest = ">=8.3,<9.0"
pytest-playwright = ">=0.6,<1.0"
requests = ">=2.32,<3.0"

[tool.poetry.group.quality.dependencies]
mypy = ">=1.14,<2.0"
ruff = ">=0.9,<1.0"
types-jsonschema = ">=4.23,<5.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--output=artifacts",
    "--screenshot=only-on-failure",
    "--tracing=retain-on-failure",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "api: HTTP API tests",
    "ui: browser-based user interface tests",
    "smoke: critical happy-path checks",
    "regression: broader functional coverage",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PT",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
